<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagos Life Mod Simulator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #121820;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .game-card {
      background: #1b2430;
      border: 1px solid #2d3b4e;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 24px; margin-bottom: 8px; color: #64b5f6; }
    p { font-size: 14px; color: #90a4ae; line-height: 1.5; margin-bottom: 24px; }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      background: #0d47a1;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .key-box {
      margin-top: 16px;
      text-align: left;
    }
    label { font-size: 12px; color: #cfd8dc; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #0e141b;
      border: 1px solid #37474f;
      border-radius: 8px;
      color: #fff;
      font-family: monospace;
      font-size: 13px;
      margin-bottom: 12px;
    }
    button.btn {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    button.btn:active { background: #1565c0; }
    .hint {
      font-size: 11px;
      color: #78909c;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="status-badge">LAGOS LIFE GAME SIMULATOR</div>
    <h1>Lagos Life Mobile</h1>
    <p>This sandbox page simulates the Lagos Life web environment to test the Secret Society mod injector locally.</p>

    <div class="key-box">
      <label for="keyInput">Set Mod License Key in localStorage:</label>
      <input type="text" id="keyInput" placeholder="LODGE-XXXX-XXXX-XXXX-XXXX" value="TEST-DEV-KEY-1234">
      <button class="btn" onclick="saveAndReload()">Activate & Run Injector</button>
    </div>

    <div class="hint">
      Look at the bottom right corner of your screen for the gold compass-and-square emblem!
    </div>
  </div>

  <script>
    // Prefill from localStorage if exists
    const existing = localStorage.getItem('lodge_license_key');
    if (existing) {
      document.getElementById('keyInput').value = existing;
    }

    function saveAndReload() {
      const val = document.getElementById('keyInput').value.trim();
      if (val) {
        localStorage.setItem('lodge_license_key', val);
        location.reload();
      }
    }
  </script>

  <!-- Injects the mod directly onto this test page -->
  <script src="/injector/loader.js"></script>
</body>
</html>
