<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 18px 16px;
      background: #0f0e0c;
      color: #e8d98c;
      font-family: Georgia, serif;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .symbol { font-size: 32px; color: #d4af37; }
    h1 {
      font-size: 16px;
      color: #d4af37;
      margin: 4px 0 2px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: bold;
    }
    p { font-size: 11px; color: #8b7320; margin: 0; }
    label {
      display: block;
      font-size: 11px;
      color: #a08030;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: #1a1810;
      border: 1px solid #3a3020;
      border-radius: 6px;
      color: #e8d98c;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #d4af37; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #d4af37, #8b7320);
      color: #0f0e0c;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.85; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      color: #81c784;
      min-height: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="symbol">⬡</div>
    <h1>The Secret Lodge</h1>
    <p>Lagos Life Mod Controller</p>
  </div>

  <label for="key">Lodge License Key:</label>
  <input type="text" id="key" placeholder="LODGE-XXXX-XXXX-XXXX-XXXX" value="TEST-DEV-KEY-1234">
  <button id="saveBtn">Activate Mod</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
